[project]
name = "ai-codereview-agent"
version = "0.1.0"
description = "Automated code review for GitLab, GitHub, and Gitea with multiple agent backends."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["biz"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
# Pin the linter so local runs match the CI job.
required-version = "==0.16.5"
target-version = "py311"

[tool.ruff.lint]
# Start with the base error/pyflakes rules only; new rule families can be
# enabled deliberately once their baseline is clean.
select = ["E4", "E7", "E9", "F"]
